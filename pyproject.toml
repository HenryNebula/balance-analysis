[project]
name = "statementledger"
version = "0.1.0"
description = "Bank statement PDFs to verified ledgers: per-bank Python parsers behind an arithmetic gate"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
statementledger = "statementledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statementledger"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pikepdf>=10.16.0",
    "pillow>=10",
    "pytest>=8",
    "python-docx>=1.1",
    "reportlab>=4",
]
