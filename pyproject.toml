[project]
name = "statementledger"
version = "0.1.0"
description = "Bank statement PDFs to verified ledgers: per-bank Python parsers behind an arithmetic gate"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pdfplumber>=0.11",
    "pikepdf>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
statementledger = "statementledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statementledger"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "spawn: launches real distill-agent subprocesses (host processes, no LLM, canned gates only; slower and timing-sensitive, deselect in CI with -m 'not spawn')",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pikepdf>=10.16.0",
    "pillow>=10",
    "pytest>=8",
    "python-docx>=1.1",
    "reportlab>=4",
]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=10",
    "pypdfium2>=4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
