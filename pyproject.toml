[project]
name = "statementledger"
version = "0.1.0"
description = "Bank statement PDFs to verified ledgers: per-bank Python parsers behind an arithmetic gate"
readme = "README.md"
license = "MIT"
authors = [{ name = "HenryNebula" }]
requires-python = ">=3.12,<3.14"
keywords = ["bank-statement", "pdf", "ledger", "parsing", "reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pdfplumber>=0.11",
    "pikepdf>=10.16.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/HenryNebula/balance-analysis"
Repository = "https://github.com/HenryNebula/balance-analysis"
Issues = "https://github.com/HenryNebula/balance-analysis/issues"
Changelog = "https://github.com/HenryNebula/balance-analysis/releases"

[project.scripts]
statementledger = "statementledger.cli:main"
statementledger-distill = "statementledger.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statementledger"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pillow>=10",
    "pytest>=8",
    "python-docx>=1.1",
    "reportlab>=4",
]
web = [
    "fastapi>=0.115",
    "pillow>=10",
    "pypdfium2>=4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
