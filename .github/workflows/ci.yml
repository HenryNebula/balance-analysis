name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync dependencies (lockfile-exact)
        run: uv sync --group web --locked

      # The web UI is a React SPA; building its bundle lets the SPA-shell
      # tests run instead of skip (the server is API-only without it).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build SPA
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: uv run --group web pytest -q
